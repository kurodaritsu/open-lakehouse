x-airflow-common:
  &airflow-common
  # Single image name so compose builds once instead of once per service.
  image: open-lakehouse/airflow:3.1.6
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file: .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 8
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Airflow 3.x uses API server instead of webserver
    AIRFLOW__API__PORT: 8085
    # BASE_URL is browser-facing (log links, login redirects), so it has to be an
    # address the browser can reach; set AIRFLOW_BASE_URL in .env for LAN access.
    # Task runners use the execution API over the bridge instead.
    AIRFLOW__API__BASE_URL: ${AIRFLOW_BASE_URL:-http://localhost:8085}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8085/execution/
    # Scheduler and api-server each auto-generate a JWT secret when unset, so
    # task-to-API calls fail with "Signature verification failed".
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    # Airflow 3 default auth is SimpleAuthManager: users are `name:role`, and
    # passwords come from a JSON file that airflow-init writes (shared via the
    # ./config/airflow mount). No `airflow users` CLI exists anymore.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Spark connection settings
    SPARK_MASTER_41: spark://spark-master-41:7078
    SPARK_REMOTE: sc://spark-connect-41:15002
    # S3/SeaweedFS settings
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    AWS_ENDPOINT_URL: http://seaweedfs:8333
    # MLflow: runs go to the tracking server, registered models to UC OSS.
    # sitecustomize on PYTHONPATH patches MLflow's S3 region lookup, which
    # SeaweedFS can't answer (see config/mlflow-client/sitecustomize.py).
    MLFLOW_TRACKING_URI: http://mlflow-server:5000
    MLFLOW_REGISTRY_URI: uc:http://unity-catalog:8080
    PYTHONPATH: /opt/mlflow-client
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - ./config/airflow:/opt/airflow/config
    - ./scripts:/opt/airflow/scripts
    - ./jars:/opt/airflow/jars
    - ./data:/opt/airflow/data
    - ./config/mlflow-client:/opt/mlflow-client:ro
  networks:
    - lakehouse-network
  # Rootless podman: map the host user to the image's airflow uid so the bind
  # mounts (dags, logs, config) are writable from inside the container.
  userns_mode: "keep-id:uid=50000,gid=0"

services:
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Create Airflow database if it doesn't exist
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1 || \
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d postgres -c "CREATE DATABASE airflow"

        # Initialize Airflow database
        airflow db migrate

        # Set admin password for SimpleAuthManager
        printf '{"%s": "%s"}\n' "${AIRFLOW_ADMIN_USER:-admin}" "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          > "$$AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE"

        echo "Airflow initialization complete"
    # Not started by `up`; ./lakehouse runs it with `compose run --rm` first
    # (podman won't let a depends_on target be removed, so no exited container
    # would otherwise linger).
    profiles: ["init"]
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: api-server
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8085/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Airflow 3 moved DAG parsing out of the scheduler; without this nothing in
  # ./dags ever loads.
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 300s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 300s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  lakehouse-network:
    driver: bridge
