# MLflow Tracking Server + AI Gateway
# ====================================
# Start: docker compose -f docker-compose-mlflow.yml up -d
# UI:    http://localhost:5000
#
# AI Gateway is embedded in the tracking server (MLflow 3.9+).
# Configure routes in config/mlflow/gateway-config.yml.
#
# The mlflow-agent sidecar is an idle Spark 4.1 container pre-loaded with
# mlflow + openai — used as the execution environment for the reference
# agent demos under scripts/demos/mlflow-agents/. It needs Ollama on the host,
# so it sits behind the `agent` profile:
#   docker compose -f docker-compose-mlflow.yml --profile agent up -d
#
# Both services are on the shared lakehouse-network bridge; peers are reached
# by name (postgres, seaweedfs, spark-master-41), host clients use localhost:5000.

services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: lakehouse-mlflow:3.13.0
    container_name: mlflow-server
    ports:
      - "5000:5000"
    environment:
      # Postgres connection — entrypoint provisions role + db as superuser
      # then hands MLflow its own credentials. Superuser creds come from .env.
      # Not ${POSTGRES_HOST}: .env holds the host-side address.
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      MLFLOW_PG_USER: "${MLFLOW_PG_USER:-mlflow}"
      MLFLOW_PG_PASS: "${MLFLOW_PG_PASS:-mlflow_password}"
      MLFLOW_PG_DB: "${MLFLOW_PG_DB:-mlflow}"
      # Artifact storage: SeaweedFS via S3
      MLFLOW_ARTIFACTS_DESTINATION: "s3://lakehouse/mlflow-artifacts"
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-admin}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-admin_password}"
      MLFLOW_S3_ENDPOINT_URL: "http://seaweedfs:8333"
      # AI Gateway config
      MLFLOW_GATEWAY_CONFIG: "/config/gateway-config.yml"
      MLFLOW_WORKERS: "${MLFLOW_WORKERS:-4}"
      # DNS-rebinding guard. Passing a list replaces MLflow's default (localhost +
      # private IPs), so re-add those next to the in-network name.
      MLFLOW_ALLOWED_HOSTS: "${MLFLOW_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow-server,mlflow-server:*,192.168.*,10.*,172.*}"
    volumes:
      - ./config/mlflow:/config:ro
    networks:
      - lakehouse-network
    healthcheck:
      # The mlflow image ships no curl; probe with its own python instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mlflow-agent:
    image: apache/spark:4.1.0-scala2.13-java21-python3-r-ubuntu
    container_name: spark-mlflow-agent
    user: root
    profiles: ["agent"]
    env_file: .env
    networks:
      - lakehouse-network
    # Ollama runs on the host, not in compose.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      # Registered models go to UC OSS; sitecustomize patches the S3 region
      # lookup SeaweedFS can't answer (config/mlflow-client/sitecustomize.py).
      - MLFLOW_REGISTRY_URI=uc:http://unity-catalog:8080
      - SPARK_MASTER=spark://spark-master-41:7078
      # Full OSS: GPT-OSS 20B via Ollama. No API keys needed.
      - LLM_MODEL=gpt-oss:20b
      - LLM_PROVIDER=openai
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - PYTHONPATH=/opt/mlflow-client:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip
      - SPARK_HOME=/opt/spark
    volumes:
      - ./config/spark:/opt/spark/conf
      - ./jars:/opt/spark/jars-extra
      - ./scripts:/scripts
      - ./data:/data
      - ./config/mlflow-client:/opt/mlflow-client:ro
    command: >
      bash -c "
        mkdir -p /opt/spark-data/logs &&
        pip install --quiet mlflow>=3.12 openai &&
        echo 'MLflow agent container ready. Using local OSS models via Ollama.' &&
        tail -f /dev/null
      "
    restart: unless-stopped

networks:
  lakehouse-network:
    driver: bridge
