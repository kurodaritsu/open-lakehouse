# Infra prerequisites: PostgreSQL 18 + SeaweedFS 4.47 (S3 gateway).
# ==================================================================
# Start: ./lakehouse start infra   (or: docker compose -f docker-compose-infra.yml up -d)
#
# Both sit on the shared lakehouse-network bridge under the aliases `postgres` /
# `seaweedfs` (upstream's service names), and publish their ports so host clients
# and the remaining host-mode services keep using localhost:5432 / :8333.
# Replaces the "install Postgres + weed on the host" step in docs/getting-started.
#
# Container names carry a lakehouse- prefix so they don't collide with other
# compose projects' `postgres` containers on the same machine.

services:
  postgres:
    # pgvector image is the official postgres image + the vector extension; drop-in
    # replacement. Keep the trixie variant: the data dir was initialised on
    # postgres:18 (trixie, glibc 2.41), and bookworm's glibc 2.36 trips a
    # collation version mismatch. Enable per-db with `CREATE EXTENSION vector`.
    image: docker.io/pgvector/pgvector:pg18-trixie
    container_name: lakehouse-postgres
    ports:
      - "5432:5432"
    networks:
      lakehouse-network:
        aliases:
          - postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
    volumes:
      # postgres:18 moved PGDATA under /var/lib/postgresql/18/; mount the parent.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.47
    container_name: lakehouse-seaweedfs
    # master 9333, volume 8080, filer 8888, S3 8333. Unity Catalog publishes 8081 for this reason.
    ports:
      - "9333:9333"
      - "8080:8080"
      - "8888:8888"
      - "8333:8333"
    networks:
      lakehouse-network:
        aliases:
          - seaweedfs
    command: >
      server -s3 -dir=/data -ip=localhost -ip.bind=0.0.0.0
      -master.port=9333 -volume.port=8080 -filer.port=8888 -s3.port=8333
      -volume.max=0
    environment:
      # Admin identity when no -s3.config file is given.
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:?set in .env}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:?set in .env}"
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
    driver: local
  seaweed-data:
    driver: local

networks:
  lakehouse-network:
    driver: bridge
