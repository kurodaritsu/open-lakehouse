# Infra prerequisites: PostgreSQL 18 + SeaweedFS 4.47 (S3 gateway).
# ==================================================================
# Start: ./lakehouse start infra   (or: docker compose -f docker-compose-infra.yml up -d)
#
# Both run on the host network so the rest of the stack keeps reaching them at
# host.docker.internal / localhost:5432 and :8333 exactly as .env already says.
# Replaces the "install Postgres + weed on the host" step in docs/getting-started.
#
# Container names carry a lakehouse- prefix so they don't collide with other
# compose projects' `postgres` containers on the same machine.

services:
  postgres:
    image: docker.io/library/postgres:18
    container_name: lakehouse-postgres
    network_mode: "host"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
    volumes:
      # postgres:18 moved PGDATA under /var/lib/postgresql/18/; mount the parent.
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.47
    container_name: lakehouse-seaweedfs
    network_mode: "host"
    # master 9333, volume 8080, filer 8888, S3 8333. Unity Catalog publishes 8081 for this reason.
    command: >
      server -s3 -dir=/data -ip=localhost -ip.bind=0.0.0.0
      -master.port=9333 -volume.port=8080 -filer.port=8888 -s3.port=8333
      -volume.max=0
    environment:
      # Admin identity when no -s3.config file is given.
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:?set in .env}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:?set in .env}"
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg-data:
    driver: local
  seaweed-data:
    driver: local
