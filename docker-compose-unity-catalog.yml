# Unity Catalog OSS v0.4.0 — the catalog for this stack.
#
# Provides:
# - REST API for Iceberg tables (read-only via Iceberg REST, full CRUD via UC API)
# - Catalog-managed commits (UC coordinates multi-engine writes)
# - Credential vending via external locations
# - Storage credentials API (AWS IAM role support)
# - Multi-format support (Delta, Iceberg via UniForm)
# - Interoperability with DuckDB, Trino, Dremio, Polars, etc.
# - Authorization framework (OAuth + grants)
# - Managed storage locations for catalogs/schemas
#
# Usage:
#   docker compose -f docker-compose-unity-catalog.yml up -d
#
# Then configure Spark to use Unity Catalog REST endpoint:
#   spark.sql.catalog.iceberg.uri = http://localhost:8080/api/2.1/unity-catalog/iceberg
#
# New in 0.4.0:
#   - Catalog-managed commits: set server.managed-table.enabled=true in server.properties
#   - External locations API: POST /api/2.1/unity-catalog/external-locations
#   - Storage credentials API: POST /api/2.1/unity-catalog/credentials
#   - Managed storage on catalogs/schemas (storage_root parameter)
#   - UniForm improvements (Delta-to-Iceberg atomic metadata updates)

services:
  unity-catalog:
    # newfrontdocker/unitycatalog:v0.4.1 is an OFFICIAL STAGING image (Docker Hub:
    # "used to test containers before publishing in unitycatalog/unitycatalog"),
    # published by a UC committer — NOT a community fork. We use it only because
    # official Docker Hub never shipped a v0.4.1 container (its tags jump v0.4.0 ->
    # v0.5.0). It adds NO Iceberg write support — neither does official 0.5.0; UC OSS
    # 0.4.x rejects data_source_format=ICEBERG outright, so this catalog is Delta-only
    # for writes and Iceberg-read-only (see CLAUDE.md). Moving to a mounted uc-data
    # volume / a UC upgrade is PR #1 — do not change the image here.
    image: newfrontdocker/unitycatalog:v0.4.1
    container_name: unity-catalog
    ports:
      - "8081:8080"      # REST API + Iceberg REST Catalog endpoint (8081 host, SeaweedFS uses 8080)
    environment:
      - JAVA_OPTS=-Xmx2g
    volumes:
      #- ./config/unity-catalog:/opt/unitycatalog/etc/conf
      - type: bind
        source: ./config/unity-catalog/server.properties
        target: /home/unitycatalog/etc/conf/server.properties
      # uc-data mounted (PR #13 / T-1.20b): persists UC's embedded H2 store to a
      # named volume so backup/restore can cover it via the volume rather than a
      # docker cp of an ephemeral container layer. UC stays on embedded H2 — this
      # only makes that state durable; it does NOT point UC at PostgreSQL.
      - uc-data:/home/unitycatalog/etc/db
      - uc-logs:/home/unitycatalog/etc/logs
    healthcheck:
      # The image ships busybox wget, NOT curl — a curl-based check can never pass and
      # leaves UC perpetually "unhealthy" (also hanging any depends_on: service_healthy).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/2.1/unity-catalog/catalogs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - lakehouse-network

  # Optional: Unity Catalog Web UI
  # Uncomment to enable the graphical interface
  # unity-catalog-ui:
  #   image: unitycatalog/unitycatalog-ui:0.4.0
  #   container_name: unity-catalog-ui
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - UC_API_URL=http://unity-catalog:8080
  #   depends_on:
  #     unity-catalog:
  #       condition: service_healthy
  #   networks:
  #     - lakehouse-network

volumes:
  uc-data:
    driver: local
  uc-logs:
    driver: local

networks:
  lakehouse-network:
    driver: bridge
