# Unity Catalog OSS v0.6.0 — the catalog for this stack.
#
# Provides:
# - REST API for Iceberg tables (read-only via Iceberg REST, full CRUD via UC API)
# - Catalog-managed commits (UC coordinates multi-engine writes)
# - Credential vending via external locations
# - Storage credentials API (AWS IAM role support)
# - Multi-format support (Delta, Iceberg via UniForm)
# - Interoperability with DuckDB, Trino, Dremio, Polars, etc.
# - Authorization framework (OAuth + grants)
# - Managed storage locations for catalogs/schemas
#
# Usage:
#   docker compose -f docker-compose-unity-catalog.yml up -d
#
# Then configure Spark to use Unity Catalog REST endpoint:
#   spark.sql.catalog.iceberg.uri = http://localhost:8080/api/2.1/unity-catalog/iceberg
#
# New since 0.5.0 / 0.6.0:
#   - UC Delta API (/api/2.1/unity-catalog/delta/v1/...): catalog-managed Delta
#     tables, schema travels through the catalog. server.managed-table.enabled
#     defaults to true. Managed tables need a storage_root on the schema.
#   - Spark connector artifact is per Spark version (unitycatalog-spark_4.1_2.13).
#   - Connector now registers column metadata in UC (0.3.0 left `columns` empty).
#   - SQL views / metric views (create needs Spark 4.2; 4.1 can only read).

services:
  unity-catalog:
    # Official image. Still NO Iceberg write support (Iceberg REST is read-only), so this
    # catalog is Delta-only for writes (see CLAUDE.md). Catalog metadata lives in
    # H2 under etc/db — persisted on the uc-data volume; without it every image
    # swap or `down` wiped all catalogs/schemas/table registrations.
    image: unitycatalog/unitycatalog:v0.6.0
    container_name: unity-catalog
    ports:
      - "8081:8080"      # REST API + Iceberg REST Catalog endpoint (8081 host, SeaweedFS uses 8080)
    environment:
      - JAVA_OPTS=-Xmx2g
    volumes:
      #- ./config/unity-catalog:/opt/unitycatalog/etc/conf
      - type: bind
        source: ./config/unity-catalog/server.properties
        target: /home/unitycatalog/etc/conf/server.properties
      - uc-data:/home/unitycatalog/etc/db
      - uc-logs:/home/unitycatalog/etc/logs
    healthcheck:
      # The image ships busybox wget, NOT curl — a curl-based check can never pass and
      # leaves UC perpetually "unhealthy" (also hanging any depends_on: service_healthy).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/2.1/unity-catalog/catalogs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      lakehouse-network:
        aliases:
          - server

  # Unity Catalog Web UI (http://localhost:3000). The image's CRA dev server
  # proxies /api to the hardcoded hostname `server:8080`, so the UC container
  # carries a `server` alias on the bridge network; UC_API_URL is not read.
  # No versioned tag exists on Docker Hub (only main / main-<sha>); pinned to a sha.
  unity-catalog-ui:
    image: unitycatalog/unitycatalog-ui:main-aadc6fc
    container_name: unity-catalog-ui
    ports:
      - "3000:3000"
    environment:
      # CRA dev server: eslint tries to write node_modules/.cache, which fails
      # under rootless podman with userns=keep-id (image files are root-owned).
      # Lint is irrelevant for a prebuilt UI, so skip the plugin.
      - DISABLE_ESLINT_PLUGIN=true
    depends_on:
      unity-catalog:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lakehouse-network

volumes:
  uc-data:
    driver: local
  uc-logs:
    driver: local

networks:
  lakehouse-network:
    driver: bridge
